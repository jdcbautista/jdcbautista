<svg xmlns="http://www.w3.org/2000/svg" width="900" height="128" viewBox="0 0 900 128" role="img" aria-label="Quote of the day">
  <rect x="0" y="0" width="900" height="128" rx="16" fill="#0d1117" stroke="#30363d"/>
