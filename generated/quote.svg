<svg xmlns="http://www.w3.org/2000/svg" width="900" height="158" viewBox="0 0 900 158" role="img" aria-label="Quote of the day">
  <rect x="0" y="0" width="900" height="158" rx="16" fill="#0d1117" stroke="#30363d"/>
  <rect x="0" y="0" width="4" height="158" rx="2" fill="#e0533d"/>
  <text x="34" y="40" fill="#8b949e" font-family="'JetBrains Mono',monospace" font-size="11" letter-spacing="3">PEAK PERFORMANCE</text>
  <text x="32" y="72" fill="#e6edf3" font-family="Georgia,serif" font-size="22" font-style="italic">Always do your best. What you plant now, you will harvest</text><text x="32" y="102" fill="#e6edf3" font-family="Georgia,serif" font-size="22" font-style="italic">later.</text>
  <text x="32" y="140" fill="#e0533d" font-family="'JetBrains Mono',monospace" font-size="12">— Og Mandino</text>
</svg>