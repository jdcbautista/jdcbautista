<svg xmlns="http://www.w3.org/2000/svg" width="900" height="156" viewBox="0 0 900 156" role="img" aria-label="Quote of the day">
  <rect x="0" y="0" width="900" height="156" rx="16" fill="#0d1117" stroke="#30363d"/>
  <rect x="0" y="0" width="4" height="156" rx="2" fill="#e0533d"/>
  <text x="34" y="40" fill="#8b949e" font-family="'JetBrains Mono',monospace" font-size="11" letter-spacing="3">QUOTE OF THE DAY</text>
  <text x="32" y="72" fill="#e6edf3" font-family="Georgia,serif" font-size="21" font-style="italic">Craft is the difference between what you meant and what you</text><text x="32" y="102" fill="#e6edf3" font-family="Georgia,serif" font-size="21" font-style="italic">made.</text>
  <text x="32" y="138" fill="#e0533d" font-family="'JetBrains Mono',monospace" font-size="12">— Julius Bautista</text>
</svg>