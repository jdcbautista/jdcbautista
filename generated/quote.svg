  <text x="34" y="40" fill="#8b949e" font-family="'JetBrains Mono',monospace" font-size="11" letter-spacing="3">BUSINESS &amp; LEADERSHIP</text>
  <text x="32" y="72" fill="#e6edf3" font-family="Georgia,serif" font-size="22" font-style="italic">Working hard for something we love is called passion.</text>
  <text x="32" y="110" fill="#e0533d" font-family="'JetBrains Mono',monospace" font-size="12">— Simon Sinek</text>
