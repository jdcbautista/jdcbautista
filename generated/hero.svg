<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Julius Bautista — rotating intro">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0533d"/>
      <stop offset="1" stop-color="#4c8bf5"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="900" height="300" rx="16" fill="url(#bg)" stroke="#30363d"/>
  <rect x="0" y="0" width="6" height="300" rx="3" fill="url(#edge)"/>
  
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.060;0.900;1"
             dur="4s" begin="0s" repeatCount="indefinite"
             calcMode="spline" keySplines="0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1" />
    <text x="48" y="90" fill="#e0533d" font-family="'JetBrains Mono',monospace"
          font-size="16" letter-spacing="4" font-weight="700">SRE / DEVOPS</text>
    <text x="46" y="140" fill="#e6edf3"
          font-family="Georgia,serif" font-size="34" font-weight="600">I build infra that stays boring in</text><text x="46" y="180" fill="#e6edf3"
          font-family="Georgia,serif" font-size="34" font-weight="600">production.</text>
    <text x="48" y="244" fill="#8b949e"
          font-family="'JetBrains Mono',monospace" font-size="14">Terraform · AWS · GitHub Actions · observability</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.060;0.900;1"
             dur="4s" begin="4s" repeatCount="indefinite"
             calcMode="spline" keySplines="0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1" />
    <text x="48" y="90" fill="#e0533d" font-family="'JetBrains Mono',monospace"
          font-size="16" letter-spacing="4" font-weight="700">APPLIED AI</text>
    <text x="46" y="140" fill="#e6edf3"
          font-family="Georgia,serif" font-size="34" font-weight="600">Agents, knowledge graphs, and</text><text x="46" y="180" fill="#e6edf3"
          font-family="Georgia,serif" font-size="34" font-weight="600">pipelines that survive real</text><text x="46" y="220" fill="#e6edf3"
          font-family="Georgia,serif" font-size="34" font-weight="600">constraints.</text>
    <text x="48" y="284" fill="#8b949e"
          font-family="'JetBrains Mono',monospace" font-size="14">Ollama · Graphiti · Neo4j · LangGraph</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.060;0.900;1"
             dur="4s" begin="8s" repeatCount="indefinite"
             calcMode="spline" keySplines="0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1" />
    <text x="48" y="90" fill="#e0533d" font-family="'JetBrains Mono',monospace"
          font-size="16" letter-spacing="4" font-weight="700">EDUCATOR</text>
    <text x="46" y="140" fill="#e6edf3"
          font-family="Georgia,serif" font-size="34" font-weight="600">Lead DevOps instructor — I turn</text><text x="46" y="180" fill="#e6edf3"
          font-family="Georgia,serif" font-size="34" font-weight="600">students into shippers.</text>
    <text x="48" y="244" fill="#8b949e"
          font-family="'JetBrains Mono',monospace" font-size="14">Code Platoon · curriculum · SCORM</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.060;0.900;1"
             dur="4s" begin="12s" repeatCount="indefinite"
             calcMode="spline" keySplines="0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1" />
    <text x="48" y="90" fill="#e0533d" font-family="'JetBrains Mono',monospace"
          font-size="16" letter-spacing="4" font-weight="700">VISUAL ARTIST</text>
    <text x="46" y="140" fill="#e6edf3"
          font-family="Georgia,serif" font-size="34" font-weight="600">USMC veteran who codes like he</text><text x="46" y="180" fill="#e6edf3"
          font-family="Georgia,serif" font-size="34" font-weight="600">composes.</text>
    <text x="48" y="244" fill="#8b949e"
          font-family="'JetBrains Mono',monospace" font-size="14">Blender · generative · story-driven</text>
  </g>
  <circle cx="794" cy="270" r="4" fill="#30363d">
    <animate attributeName="fill" dur="16s" repeatCount="indefinite"
      calcMode="discrete" keyTimes="0;0.250" values="#e0533d;#30363d" />
  </circle><circle cx="816" cy="270" r="4" fill="#30363d">
    <animate attributeName="fill" dur="16s" repeatCount="indefinite"
      calcMode="discrete" keyTimes="0;0.250;0.500" values="#30363d;#e0533d;#30363d" />
  </circle><circle cx="838" cy="270" r="4" fill="#30363d">
    <animate attributeName="fill" dur="16s" repeatCount="indefinite"
      calcMode="discrete" keyTimes="0;0.500;0.750" values="#30363d;#e0533d;#30363d" />
  </circle><circle cx="860" cy="270" r="4" fill="#30363d">
    <animate attributeName="fill" dur="16s" repeatCount="indefinite"
      calcMode="discrete" keyTimes="0;0.750;1.000" values="#30363d;#e0533d;#30363d" />
  </circle>
  <text x="48" y="276" fill="#8b949e" font-family="'JetBrains Mono',monospace"
        font-size="12" opacity="0.8">▶ enter the site →</text>
</svg>