# Main dispatcher. One job, a switch step decides what to (re)build, then it
# assembles the README and commits. Content-hashed asset URLs mean unchanged
# images don't churn the README.
#
#   schedule (daily) → refresh the feed + quote only (the day-to-day items)
#   workflow_dispatch → the module you pick (or all)
#   push (config/scripts/assets) → just the modules whose inputs changed
name: profile-update

on:
  schedule:
    - cron: "17 1 * * *" # twice daily
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      module:
        description: "Which module to rebuild"
        default: all
        type: choice
        options: [all, hero, tool-wall, feed, quote]
  push:
    branches: [main]
    paths:
      - "config/**"
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/profile-update.yml"

permissions:
  contents: write

concurrency:
  group: profile-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci

      # ---- THE SWITCH: decide which modules to (re)build --------------------
      - id: sw
        env:
          EVENT: ${{ github.event_name }}
          PICK: ${{ github.event.inputs.module }}
          BEFORE: ${{ github.event.before }}
        run: |
          hero=false; toolwall=false; feed=false; quote=false
          case "$EVENT" in
            schedule)
              feed=true; quote=true ;;               # daily items only
            workflow_dispatch)
              case "$PICK" in
                all)       hero=true; toolwall=true; feed=true; quote=true ;;
                hero)      hero=true ;;
                tool-wall) toolwall=true ;;
                feed)      feed=true ;;
                quote)     quote=true ;;
              esac ;;
            push)
              if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                hero=true; toolwall=true; feed=true; quote=true
              else
                ch=$(git diff --name-only "$BEFORE" "${{ github.sha }}" || echo "")
                echo "$ch" | grep -qE 'config/hero|render-hero|profile.json'                 && hero=true
                echo "$ch" | grep -qE 'config/tools|assets/tools|render-tool-wall|fetch-icons' && toolwall=true
                echo "$ch" | grep -qE 'config/feed|render-feed|fetch-feed'                    && feed=true
                echo "$ch" | grep -qE 'config/quotes|config/speakers|render-quote'            && quote=true
                echo "$ch" | grep -qE 'scripts/lib|assemble-readme|\.github/'                 && { hero=true; toolwall=true; feed=true; quote=true; }
              fi ;;
          esac
          { echo "hero=$hero"; echo "toolwall=$toolwall"; echo "feed=$feed"; echo "quote=$quote"; } >> "$GITHUB_OUTPUT"
          echo "switch → hero=$hero toolwall=$toolwall feed=$feed quote=$quote"

      # ---- render selected modules (fetch first where needed) --------------
      - if: steps.sw.outputs.toolwall == 'true'
        run: node scripts/fetch-icons.mjs && node scripts/render-tool-wall.mjs
      - if: steps.sw.outputs.feed == 'true'
        run: node scripts/fetch-feed.mjs && node scripts/render-feed.mjs
      - if: steps.sw.outputs.quote == 'true'
        run: node scripts/render-quote.mjs
      - if: steps.sw.outputs.hero == 'true'
        run: node scripts/render-hero.mjs

      - name: Assemble README
        run: node scripts/assemble-readme.mjs

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md generated/ config/feed.json archive/ assets/tools/
          if git diff --staged --quiet; then
            echo "nothing to update"
          else
            git commit -m "chore: profile-update [skip ci]"
            git push
          fi
